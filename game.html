<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Moon Walker — $MWALK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #fff; min-height: 100vh; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; }
        .hud { position: fixed; top: 12px; left: 12px; z-index: 10; pointer-events: none; }
        .hud-row { display: flex; gap: 8px; margin-bottom: 6px; }
        .hud-item { background: rgba(0,0,0,0.75); padding: 6px 12px; border-radius: 8px; font-size: 12px; backdrop-filter: blur(4px); }
        .hud-val { font-weight: 700; }
        .hud-val.dist { color: #7ec8ff; }
        .hud-val.stars { color: #ffd700; }
        .hud-val.lives { color: #ff4444; }
        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
        .ctrl { width: 64px; height: 64px; background: rgba(126,200,255,0.2); border: 1px solid rgba(126,200,255,0.4); border-radius: 50%; color: #7ec8ff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .ctrl:active { background: rgba(126,200,255,0.4); }
        .start { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .start h1 { font-size: 36px; background: linear-gradient(135deg,#7ec8ff,#3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .start p { color: #666; font-size: 14px; margin-bottom: 20px; text-align: center; max-width: 280px; }
        .btn { padding: 14px 32px; border: none; border-radius: 10px; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
        .btn:active { transform: scale(0.96); }
        .btn-go { background: linear-gradient(135deg,#7ec8ff,#3b82f6); }
        .btn-tw { background: linear-gradient(135deg,#1da1f2,#0d8ecf); }
        .game-over { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .game-over.show { display: flex; }
        .game-over h2 { font-size: 28px; color: #7ec8ff; margin-bottom: 8px; }
        .game-over .final { font-size: 52px; font-weight: 800; color: #ffd700; }
        .game-over .sub { color: #888; font-size: 13px; margin: 8px 0 4px; }
        .game-over .recap { background: #14141f; border-radius: 12px; padding: 14px; margin: 12px 0; font-size: 13px; width: 260px; }
        .game-over .recap div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a1a1a; }
        .game-over .recap .k { color: #666; } .game-over .recap .v { color: #fff; font-weight: 600; }
        .stock-bar { position: fixed; top: 12px; right: 12px; z-index: 10; pointer-events: none; }
        .stock-tag { background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; margin-bottom: 3px; text-align: right; }
        .stock-tag .n { color: #666; } .stock-tag .p { color: #00ff88; }
    </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
    <div class="hud-row">
        <div class="hud-item">🗺️ <span class="hud-val dist" id="hDist">0</span>m</div>
        <div class="hud-item">⭐ <span class="hud-val stars" id="hStars">0</span></div>
        <div class="hud-item">❤️ <span class="hud-val lives" id="hLives">3</span></div>
    </div>
</div>

<div class="stock-bar">
    <div class="stock-tag"><span class="n">SpaceX</span> <span class="p">$112</span></div>
    <div class="stock-tag"><span class="n">RKLB</span> <span class="p">$18</span></div>
</div>

<div class="controls" id="controls" style="display:none">
    <div class="ctrl" id="btnLeft">←</div>
    <div class="ctrl" id="btnJump">↑</div>
    <div class="ctrl" id="btnRight">→</div>
</div>

<div class="start" id="startScreen">
    <h1>🗺️ Moon Walker</h1>
    <p>Walk across the moon! Jump over asteroids. Collect stars. How far can you go?</p>
    <button class="btn btn-go" onclick="startGame()">🗺️ Start Walking</button>
</div>

<div class="game-over" id="go">
    <h2>🗺️ Journey's End</h2>
    <div class="final" id="goDist">0</div>
    <div class="sub">meters walked</div>
    <div class="recap" id="recap"></div>
    <button class="btn btn-go" onclick="startGame()">🗺️ Walk Again</button>
    <button class="btn btn-tw" onclick="share()">📤 Share</button>
</div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W, H, GROUND;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; GROUND = H - 80; }
resize(); addEventListener('resize', resize);

const LS = 'mwalk_v3';
let save = JSON.parse(localStorage.getItem(LS)||'{}');
let bestDist = save.best || 0;

let walker, dist, starsCollected, lives, gameActive, speed;
let obstacles, starDrops, particles, frameCount, stars3;
let shakeMag, coyoteFrames, jumpBuffered;

function genStars() {
    stars3 = [[],[],[]];
    for(let l=0;l<3;l++) for(let i=0;i<40;i++) stars3[l].push({x:Math.random()*W*2,y:Math.random()*H,s:0.5+l*0.5,speed:0.2+l*0.3});
}

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('go').classList.remove('show');
    document.getElementById('controls').style.display = 'flex';
    
    walker = {x:W*0.3,y:GROUND-20,vy:0,w:24,h:30,grounded:true,facing:1};
    dist=0; starsCollected=0; lives=3; gameActive=true; speed=3;
    obstacles=[]; starDrops=[]; particles=[];
    frameCount=0; shakeMag=0; coyoteFrames=0; jumpBuffered=false;
    
    updateHUD();
}

function jump() {
    if(!gameActive) return;
    if(walker.grounded || coyoteFrames > 0) {
        walker.vy = -11;
        walker.grounded = false;
        coyoteFrames = 0;
    } else { jumpBuffered = true; }
}

function moveLeft() { if(gameActive) walker.facing = -1; }
function moveRight() { if(gameActive) walker.facing = 1; }

function update() {
    if(!gameActive) return;
    frameCount++;
    dist += speed * 0.05;
    speed = 3 + Math.floor(dist / 200) * 0.3;
    
    walker.vy += 0.4;
    walker.y += walker.vy;
    walker.x += walker.facing * 1.5;
    walker.x = Math.max(30, Math.min(W-30, walker.x));
    
    if(walker.grounded) coyoteFrames = 6;
    else if(coyoteFrames > 0) coyoteFrames--;
    
    if(walker.y >= GROUND - walker.h) {
        walker.y = GROUND - walker.h;
        walker.vy = 0;
        if(!walker.grounded) {
            walker.grounded = true;
            if(jumpBuffered) { jump(); jumpBuffered = false; }
        }
    }
    
    // Spawn obstacles
    if(frameCount % 60 === 0 && Math.random() < 0.7) {
        obstacles.push({x:W+50,size:18+Math.random()*15,speed:speed});
    }
    
    // Spawn stars
    if(frameCount % 90 === 0) {
        starDrops.push({x:W+30,y:GROUND-60-Math.random()*80,size:12,speed:speed});
    }
    
    // Move obstacles
    obstacles = obstacles.filter(o => {
        o.x -= o.speed;
        const dx = walker.x - o.x, dy = walker.y - (GROUND - o.size);
        if(Math.abs(dx) < walker.w/2+o.size && Math.abs(dy) < walker.h/2+o.size) {
            lives--;
            shake(8);
            spawnBurst(walker.x, walker.y, '#ff4444', 12);
            if(lives <= 0) endGame();
            return false;
        }
        return o.x > -50;
    });
    
    // Move stars
    starDrops = starDrops.filter(s => {
        s.x -= s.speed;
        const dx = walker.x - s.x, dy = walker.y - s.y;
        if(Math.sqrt(dx*dx+dy*dy) < 25) {
            starsCollected++;
            spawnBurst(s.x, s.y, '#ffd700', 6);
            return false;
        }
        return s.x > -30;
    });
    
    particles = particles.filter(p => { p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--; return p.life>0; });
    
    shakeMag *= 0.9;
    if(shakeMag < 0.5) shakeMag = 0;
    
    updateHUD();
}

function draw() {
    cx.save();
    if(shakeMag > 0) cx.translate((Math.random()-0.5)*shakeMag,(Math.random()-0.5)*shakeMag);
    
    // Sky
    const grad = cx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#000010');
    grad.addColorStop(1,'#0a0a2a');
    cx.fillStyle = grad;
    cx.fillRect(0,0,W,H);
    
    // Parallax stars
    stars3.forEach((layer,li) => {
        cx.fillStyle = `rgba(255,255,255,${0.15+li*0.1})`;
        layer.forEach(s => {
            s.x -= s.speed;
            if(s.x < -5) s.x = W+5;
            cx.beginPath(); cx.arc(s.x, s.y, s.s, 0, Math.PI*2); cx.fill();
        });
    });
    
    // Earth
    const earthSize = Math.max(5, 40 - dist*0.01);
    cx.fillStyle = '#1a3a5a';
    cx.beginPath(); cx.arc(W-60, 60, earthSize, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#2a5a8a';
    cx.beginPath(); cx.arc(W-60, 60, earthSize*0.7, 0, Math.PI*2); cx.fill();
    
    // Ground
    cx.fillStyle = '#c0c0c0';
    cx.fillRect(0, GROUND, W, H-GROUND);
    
    // Obstacles (Vibe Viber style cubes)
    obstacles.forEach(o => {
        cx.fillStyle = '#ff4444';
        cx.fillRect(o.x-o.size, GROUND-o.size*2, o.size*2, o.size*2);
        cx.fillStyle = '#cc2222';
        cx.fillRect(o.x-o.size*0.6, GROUND-o.size*1.6, o.size*1.2, o.size*0.8);
        // Eyes
        cx.fillStyle = '#fff';
        cx.fillRect(o.x-o.size*0.4, GROUND-o.size*1.4, o.size*0.3, o.size*0.3);
        cx.fillRect(o.x+o.size*0.1, GROUND-o.size*1.4, o.size*0.3, o.size*0.3);
    });
    
    // Stars (Vibe Viber style)
    starDrops.forEach(s => {
        cx.fillStyle = '#ffd700';
        cx.fillRect(s.x-s.size/2, s.y-s.size/2, s.size, s.size);
        cx.fillStyle = '#fff';
        cx.fillRect(s.x-s.size/4, s.y-s.size/4, s.size/2, s.size/2);
    });
    
    // Walker (Vibe Viber style)
    cx.save();
    cx.translate(walker.x, walker.y);
    cx.scale(walker.facing, 1);
    
    // Shadow
    cx.fillStyle = 'rgba(0,0,0,0.3)';
    cx.beginPath();
    cx.ellipse(0, walker.h, walker.w*0.8, 6, 0, 0, Math.PI*2);
    cx.fill();
    
    // Legs
    const legPhase = Math.sin(frameCount*0.2) * 4;
    cx.fillStyle = '#5a9ac0';
    cx.fillRect(-6, walker.h/2, 5, 8+legPhase);
    cx.fillRect(2, walker.h/2, 5, 8-legPhase);
    
    // Chunky space boots
    cx.fillStyle = '#3a3a5a';
    cx.fillRect(-8, walker.h/2+6+legPhase, 8, 4);
    cx.fillRect(0, walker.h/2+6-legPhase, 8, 4);
    
    // Body
    cx.fillStyle = '#7ec8ff';
    cx.fillRect(-walker.w/2, -walker.h/2, walker.w, walker.h);
    
    // Helmet
    cx.fillStyle = '#e8e0d0';
    cx.fillRect(-14, -walker.h/2-18, 28, 24);
    
    // Visor slit
    cx.fillStyle = '#1a1a3a';
    cx.fillRect(-10, -walker.h/2-10, 20, 4);
    
    // Planet antenna
    cx.fillStyle = '#7ec8ff';
    cx.fillRect(-2, -walker.h/2-28, 4, 10);
    cx.fillStyle = '#c0c0c0';
    cx.beginPath();
    cx.arc(0, -walker.h/2-30, 6, 0, Math.PI*2);
    cx.fill();
    
    // Arms
    cx.fillStyle = '#5a9ac0';
    cx.fillRect(walker.w/2, -8, 6, 16);
    cx.fillRect(-walker.w/2-6, -8, 6, 16);
    
    cx.restore();
    
    // Particles
    particles.forEach(p => {
        cx.fillStyle = p.color;
        cx.globalAlpha = p.life/20;
        cx.beginPath(); cx.arc(p.x, p.y, 2, 0, Math.PI*2); cx.fill();
    });
    cx.globalAlpha = 1;
    
    cx.restore();
}

function spawnBurst(x,y,color,n) {
    for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:15,color});
}

function shake(m) { shakeMag = Math.max(shakeMag, m); }

function updateHUD() {
    document.getElementById('hDist').textContent = Math.floor(dist);
    document.getElementById('hStars').textContent = starsCollected;
    document.getElementById('hLives').textContent = lives;
}

function endGame() {
    gameActive = false;
    const d = Math.floor(dist);
    if(d > bestDist) bestDist = d;
    localStorage.setItem(LS, JSON.stringify({best:bestDist}));
    
    document.getElementById('goDist').textContent = d;
    document.getElementById('recap').innerHTML = `
        <div><span class="k">Distance</span><span class="v">${d}m</span></div>
        <div><span class="k">Stars</span><span class="v">${starsCollected}</span></div>
        <div><span class="k">Best Ever</span><span class="v">${bestDist}m</span></div>
    `;
    document.getElementById('go').classList.add('show');
    document.getElementById('controls').style.display = 'none';
}

function share() {
    const text = `🗺️ Moon Walker — $MWALK\n\nWalked ${Math.floor(dist)}m on the moon!\n⭐ ${starsCollected} stars\n\nPlay: [link]\n@vibevibe_fun`;
    open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
}

document.getElementById('btnLeft').addEventListener('pointerdown', e => { e.preventDefault(); moveLeft(); });
document.getElementById('btnRight').addEventListener('pointerdown', e => { e.preventDefault(); moveRight(); });
document.getElementById('btnJump').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
addEventListener('keydown', e => {
    if(e.key==='ArrowLeft'||e.key==='a') moveLeft();
    if(e.key==='ArrowRight'||e.key==='d') moveRight();
    if(e.key==='ArrowUp'||e.key===' '||e.key==='w') { e.preventDefault(); jump(); }
});

genStars();
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
